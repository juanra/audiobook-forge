# Configuration for cargo-deny. See https://embarkstudios.github.io/cargo-deny/

[advisories]
# Fail on any security advisory affecting the dependency tree.
yanked = "warn"
ignore = [
    # h2 unbounded empty DATA frames (DoS). Reaching the patched 0.4.16 means
    # moving reqwest 0.11 -> 0.12, a major bump that touches the Audible client.
    # Tracked in issue #34 rather than rushed in alongside enabling CI.
    "RUSTSEC-2026-0258",
    # Unmaintained crates, not exploitable on their own. Both arrive through
    # dependencies (indicatif, reqwest) and neither has a safe upgrade today.
    # Also noted in issue #34; rustls-pemfile may resolve with that upgrade.
    "RUSTSEC-2025-0119", # number_prefix
    "RUSTSEC-2025-0134", # rustls-pemfile
]

[licenses]
# Permissive licences only. Anything else needs a deliberate decision, so it
# should fail the build and be discussed rather than pulled in silently.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
# The `epub` crate is GPL-3.0. It is a direct dependency used only by
# `parse_epub_chapters`, and its licence is incompatible with this project's
# MIT licence for distributed binaries. Allowed here so the gate reflects
# today's reality rather than failing every build; the incompatibility itself
# is tracked as an issue and needs a decision, not a config entry.
exceptions = [
    { name = "epub", allow = ["GPL-3.0"] },
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io. A git or alternative-registry dependency slipping in through a
# pull request is exactly the supply-chain shape worth failing on.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
