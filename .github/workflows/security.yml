name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly disclosed advisories are caught even when nothing is pushed.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: rust
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3

  deny:
    name: Advisories, licences and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo-deny covers the RustSec advisory database as well as licences,
      # banned crates and source registries, and it honours the documented
      # exceptions in deny.toml. rustsec/audit-check was dropped: it duplicated
      # the advisory check, could not read those exceptions, and needed
      # `checks: write` to report at all.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
